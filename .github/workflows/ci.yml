name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

env:
  DATABASE_URL: postgresql://helikon:helikon@localhost:5435/helikon_test
  TEST_DATABASE_URL: postgresql://helikon:helikon@localhost:5435/helikon_test
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: helikon
          POSTGRES_PASSWORD: helikon
          POSTGRES_DB: helikon_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U helikon"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # A push to develop deploys to dev on Vercel by itself. This brings the dev database up to date.
  migrate-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
